<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Boundary coverage</title>
  <desc id="desc">L4D2-4096 technical diagram. Values are tied to build 23990068.</desc>
  <style>
    :root { color-scheme: light dark; }
    text { font-family: Inter,Segoe UI,Arial,sans-serif; fill: #17202a; }
    .bg { fill: #f7f9fb; } .panel { fill: #ffffff; stroke: #b9c4cf; stroke-width: 1.5; }
    .old { fill: #e8edf2; stroke: #667687; stroke-width: 1.5; }
    .new { fill: #d9f3e5; stroke: #2c8b57; stroke-width: 1.5; }
    .wire { fill: #dceafe; stroke: #356eb8; stroke-width: 1.5; }
    .label { font-size: 16px; font-weight: 500; } .small { font-size: 13px; }
    .muted { font-size: 12px; fill: #526273; } .arrow { stroke: #425466; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .good { fill: #2c8b57; } .axis { stroke: #748394; stroke-width: 1; }
    @media (prefers-color-scheme: dark) { text { fill: #e8eef5; } .bg { fill: #151b22; } .panel { fill: #1e2732; stroke: #718096; } .old { fill: #303b47; stroke: #9aa9b8; } .new { fill: #19452f; stroke: #68d391; } .wire { fill: #17375f; stroke: #73a7ed; } .muted { fill: #b4c0cc; } .axis { stroke: #95a4b4; } .arrow { stroke: #c1cfdd; } }
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#425466"/></marker></defs>
  <rect class="bg" width="100%" height="100%"/>
<text x="40" y="38" class="label">Boundary coverage</text>
<text x="40" y="62" class="muted">Categorical anchors (not to scale) · not full simultaneous occupation of 4096 slots</text>
<line x1="140" y1="140" x2="860" y2="140" class="axis"/>
<circle cx="140.0" cy="140" r="10" class="new"/>
<text x="140.0" y="116" text-anchor="middle" class="label">2047</text>
<text x="140.0" y="178" text-anchor="middle" class="small">vanilla ceiling</text>
<text x="140.0" y="198" text-anchor="middle" class="muted">API round-trip</text>
<circle cx="380.0" cy="140" r="10" class="new"/>
<text x="380.0" y="116" text-anchor="middle" class="label">2048</text>
<text x="380.0" y="178" text-anchor="middle" class="small">first added</text>
<text x="380.0" y="198" text-anchor="middle" class="muted">create/update/delete</text>
<circle cx="620.0" cy="140" r="10" class="new"/>
<text x="620.0" y="116" text-anchor="middle" class="label">2049</text>
<text x="620.0" y="178" text-anchor="middle" class="small">edge pair</text>
<text x="620.0" y="198" text-anchor="middle" class="muted">client visible</text>
<circle cx="860.0" cy="140" r="10" class="new"/>
<text x="860.0" y="116" text-anchor="middle" class="label">4095</text>
<text x="860.0" y="178" text-anchor="middle" class="small">maximum</text>
<text x="860.0" y="198" text-anchor="middle" class="muted">reuse + callbacks</text>
<text x="100" y="246" class="muted">2047 is the vanilla ceiling · 2048 is the first added index · 4095 is the highest valid network index</text>
</svg>
